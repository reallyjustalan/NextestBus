<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="A minimal NUS Nextest Bus viewer.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="NUS Nextest Bus">
    <title>NUS Nextest Bus</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <!-- Font Awesome Free 5.15.4 by @fontawesome - https://fontawesome.com/license/free -->
      <symbol id="fa-walking" viewBox="0 0 320 512">
        <path d="M208 96c26.5 0 48-21.5 48-48S234.5 0 208 0s-48 21.5-48 48 21.5 48 48 48zm94.5 149.1l-23.3-11.8-9.7-29.4c-14.7-44.6-55.7-75.8-102.2-75.9-36-.1-55.9 10.1-93.3 25.2-21.6 8.7-39.3 25.2-49.7 46.2L17.6 213c-7.8 15.8-1.5 35 14.2 42.9 15.6 7.9 34.6 1.5 42.5-14.3L81 228c3.5-7 9.3-12.5 16.5-15.4l26.8-10.8-15.2 60.7c-5.2 20.8.4 42.9 14.9 58.8l59.9 65.4c7.2 7.9 12.3 17.4 14.9 27.7l18.3 73.3c4.3 17.1 21.7 27.6 38.8 23.3 17.1-4.3 27.6-21.7 23.3-38.8l-22.2-89c-2.6-10.3-7.7-19.9-14.9-27.7l-45.5-49.7 17.2-68.7 5.5 16.5c5.3 16.1 16.7 29.4 31.7 37l23.3 11.8c15.6 7.9 34.6 1.5 42.5-14.3 7.7-15.7 1.4-35.1-14.3-43zM73.6 385.8c-3.2 8.1-8 15.4-14.2 21.5l-50 50.1c-12.5 12.5-12.5 32.8 0 45.3s32.7 12.5 45.2 0l59.4-59.4c6.1-6.1 10.9-13.4 14.2-21.5l13.5-33.8c-55.3-60.3-38.7-41.8-47.4-53.7l-20.7 51.5z"></path>
      </symbol>
      <symbol id="fa-bus-alt" viewBox="0 0 512 512">
        <path d="M488 128h-8V80c0-44.8-99.2-80-224-80S32 35.2 32 80v48h-8c-13.25 0-24 10.74-24 24v80c0 13.25 10.75 24 24 24h8v160c0 17.67 14.33 32 32 32v32c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32v-32h192v32c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32v-32h6.4c16 0 25.6-12.8 25.6-25.6V256h8c13.25 0 24-10.75 24-24v-80c0-13.26-10.75-24-24-24zM160 72c0-4.42 3.58-8 8-8h176c4.42 0 8 3.58 8 8v16c0 4.42-3.58 8-8 8H168c-4.42 0-8-3.58-8-8V72zm-48 328c-17.67 0-32-14.33-32-32s14.33-32 32-32 32 14.33 32 32-14.33 32-32 32zm128-112H128c-17.67 0-32-14.33-32-32v-96c0-17.67 14.33-32 32-32h112v160zm32 0V128h112c17.67 0 32 14.33 32 32v96c0 17.67-14.33 32-32 32H272zm128 112c-17.67 0-32-14.33-32-32s14.33-32 32-32 32 14.33 32 32-14.33 32-32 32z"></path>
      </symbol>
    </svg>
    <div id="pullRefreshIndicator" class="pull-refresh-indicator" aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 8.5A7.5 7.5 0 1 0 20.25 13"></path>
        <path d="M19 4v4.5h-4.5"></path>
      </svg>
      <span>Pull to refresh</span>
    </div>
    <main class="app">
      <header class="app-header">
        <div class="header-top">
          <div class="brand">
            <button id="homeButton" class="brand-home" type="button" aria-label="Reset and return to all stops">
              <span class="logo" aria-hidden="true">
                <svg viewBox="0 0 512 512" aria-hidden="true">
                  <rect width="512" height="512" rx="104" fill="#0f766e"></rect>
                  <rect x="28" y="28" width="456" height="456" rx="82" fill="none" stroke="#58bbb2" stroke-width="10" opacity=".55"></rect>
                  <g class="logo-bus" transform="translate(74 262)">
                    <path d="M23 41c0-23 18-41 41-41h180c24 0 44 17 49 40l15 69h25c13 0 24 11 24 24v31c0 16-13 29-29 29H31c-17 0-31-14-31-31V64c0-13 10-23 23-23z" fill="#fff"></path>
                    <path d="M64 36h45v58H64zm70 0h45v58h-45zm70 0h39c12 0 22 8 25 20l8 38h-72z" fill="#0b3f3a"></path>
                    <path d="M313 125h42v36h-42zM0 125h37v36H0z" fill="#d8efea"></path>
                    <circle cx="91" cy="193" r="36" fill="#0b3f3a"></circle>
                    <circle cx="91" cy="193" r="21" fill="#fff"></circle>
                    <circle cx="258" cy="193" r="36" fill="#0b3f3a"></circle>
                    <circle cx="258" cy="193" r="21" fill="#fff"></circle>
                  </g>
                </svg>
              </span>
            </button>
            <div class="brand-copy">
              <h1>NUS Nextest Bus</h1>
              <div class="status-row">
                <button id="refreshButton" class="refresh-button" type="button" aria-label="Refresh arrival data">
                  <span id="loadStatus">Loading stops...</span>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 8.5A7.5 7.5 0 1 0 20.25 13"></path>
                    <path d="M19 4v4.5h-4.5"></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <nav class="header-nav" aria-label="Primary">
            <button id="mainPageHeaderLink" class="header-link" type="button">Stops</button>
            <button id="directionsHeaderLink" class="header-link" type="button">Directions</button>
          </nav>
        </div>

        <div class="controls">
          <label class="search">
            <span>Search</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="CLB, UTown, Kent Ridge...">
          </label>
          <button id="locationButton" class="icon-button gps-button" type="button" aria-label="Use current location">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 2v3"></path>
              <path d="M12 19v3"></path>
              <path d="M2 12h3"></path>
              <path d="M19 12h3"></path>
              <circle cx="12" cy="12" r="8"></circle>
            </svg>
          </button>
        </div>

        <section id="installPrompt" class="install-prompt" hidden aria-label="Install app">
          <div>
            <strong id="installTitle">Use it like a bus app</strong>
            <p id="installText">Add it to your home screen for quick access.</p>
          </div>
          <button id="installButton" class="small-button" type="button">Add</button>
          <button id="installDismiss" class="dismiss-button" type="button" aria-label="Dismiss install prompt">×</button>
        </section>
      </header>

      <section class="stops-section" aria-label="Bus stops">
        <div id="stopList" class="stop-list"></div>
      </section>

      <section id="routeView" class="route-view" hidden aria-live="polite">
        <header class="route-view-header">
          <span id="routeBadge" class="route-badge"></span>
          <div>
            <h2 id="routeTitle"></h2>
            <p id="routeMeta"></p>
          </div>
        </header>
        <div id="routeBody" class="route-body"></div>
      </section>

      <section id="directionsView" class="directions-view" hidden aria-live="polite">
        <header class="directions-header">
          <div>
            <h2>Directions</h2>
            <p>Find campus-bus routes between stops or NUS venues.</p>
            <p>* Work-in-progress!</p>
          </div>
        </header>

        <form id="directionsForm" class="directions-form" autocomplete="off">
          <label class="direction-field">
            <span>From</span>
            <input id="directionsFromInput" type="search" autocomplete="off" placeholder="Venue or bus stop">
          </label>
          <button id="directionsCurrentLocationButton" class="icon-button directions-gps-button" type="button" aria-label="Suggest nearby locations from current location">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 2v3"></path>
              <path d="M12 19v3"></path>
              <path d="M2 12h3"></path>
              <path d="M19 12h3"></path>
              <circle cx="12" cy="12" r="8"></circle>
            </svg>
          </button>
          <label class="direction-field">
            <span>To</span>
            <input id="directionsToInput" type="search" autocomplete="off" placeholder="Venue or bus stop">
          </label>
          <button id="directionsSwapButton" class="swap-button" type="button" aria-label="Swap start and destination">⇅</button>
          <button id="directionsSubmitButton" class="small-button directions-submit-button" type="submit">Find Route</button>
        </form>

        <div id="directionsResult" class="directions-result"></div>
        <div id="directionsSuggestions" class="directions-suggestions" hidden></div>
      </section>

      <footer class="app-footer" aria-labelledby="aboutTitle">
        <h2 id="aboutTitle">About</h2>
        <p>
          Bus stop, route, and arrival data are provided by
          <a href="https://nusbus.com/" target="_blank" rel="noopener noreferrer">nusbus.com</a>
          through their API.
        </p>
      </footer>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
