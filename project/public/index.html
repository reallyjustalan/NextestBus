<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="A minimal NUS bus arrivals viewer.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="NUS Bus">
    <title>NUS Bus Arrivals</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="pullRefreshIndicator" class="pull-refresh-indicator" aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
        <path d="M20 4v6h-6"></path>
      </svg>
      <span>Pull to refresh</span>
    </div>
    <main class="app">
      <header class="app-header">
        <div class="header-top">
          <div class="brand">
            <button id="homeButton" class="brand-home" type="button" aria-label="Reset and return to all stops">
              <span class="logo" aria-hidden="true">
                <svg viewBox="0 0 512 512" aria-hidden="true">
                  <rect width="512" height="512" rx="104" fill="#0f766e"></rect>
                  <rect x="28" y="28" width="456" height="456" rx="82" fill="none" stroke="#58bbb2" stroke-width="10" opacity=".55"></rect>
                  <g class="logo-bus" transform="translate(74 262)">
                    <path d="M23 41c0-23 18-41 41-41h180c24 0 44 17 49 40l15 69h25c13 0 24 11 24 24v31c0 16-13 29-29 29H31c-17 0-31-14-31-31V64c0-13 10-23 23-23z" fill="#fff"></path>
                    <path d="M64 36h45v58H64zm70 0h45v58h-45zm70 0h39c12 0 22 8 25 20l8 38h-72z" fill="#0b3f3a"></path>
                    <path d="M313 125h42v36h-42zM0 125h37v36H0z" fill="#d8efea"></path>
                    <circle cx="91" cy="193" r="36" fill="#0b3f3a"></circle>
                    <circle cx="91" cy="193" r="21" fill="#fff"></circle>
                    <circle cx="258" cy="193" r="36" fill="#0b3f3a"></circle>
                    <circle cx="258" cy="193" r="21" fill="#fff"></circle>
                  </g>
                </svg>
              </span>
            </button>
            <div class="brand-copy">
              <h1>NUS Bus Arrivals</h1>
              <div class="status-row">
                <button id="refreshButton" class="refresh-button" type="button" aria-label="Refresh arrival data">
                  <span id="loadStatus">Loading stops...</span>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
                    <path d="M20 4v6h-6"></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <nav class="header-nav" aria-label="Primary">
            <button id="mainPageHeaderLink" class="header-link" type="button">Stops</button>
            <button id="directionsHeaderLink" class="header-link" type="button">Directions</button>
          </nav>
        </div>

        <div class="controls">
          <label class="search">
            <span>Search</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="CLB, UTown, Kent Ridge...">
          </label>
          <button id="locationButton" class="icon-button gps-button" type="button" aria-label="Use current location">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 2v3"></path>
              <path d="M12 19v3"></path>
              <path d="M2 12h3"></path>
              <path d="M19 12h3"></path>
              <circle cx="12" cy="12" r="8"></circle>
            </svg>
          </button>
        </div>

        <section id="installPrompt" class="install-prompt" hidden aria-label="Install app">
          <div>
            <strong id="installTitle">Use it like a bus app</strong>
            <p id="installText">Add it to your home screen for quick access.</p>
          </div>
          <button id="installButton" class="small-button" type="button">Add</button>
          <button id="installDismiss" class="dismiss-button" type="button" aria-label="Dismiss install prompt">×</button>
        </section>
      </header>

      <section class="stops-section" aria-label="Bus stops">
        <div id="stopList" class="stop-list"></div>
      </section>

      <section id="routeView" class="route-view" hidden aria-live="polite">
        <header class="route-view-header">
          <span id="routeBadge" class="route-badge"></span>
          <div>
            <h2 id="routeTitle"></h2>
            <p id="routeMeta"></p>
          </div>
        </header>
        <div id="routeBody" class="route-body"></div>
      </section>

      <section id="directionsView" class="directions-view" hidden aria-live="polite">
        <header class="directions-header">
          <div>
            <h2>Directions</h2>
            <p>Find the best campus-bus route between stops or NUS venues.</p>
          </div>
        </header>

        <form id="directionsForm" class="directions-form" autocomplete="off">
          <label class="direction-field">
            <span>From</span>
            <input id="directionsFromInput" type="search" autocomplete="off" placeholder="Venue or bus stop">
          </label>
          <button id="directionsCurrentLocationButton" class="icon-button directions-gps-button" type="button" aria-label="Suggest nearby locations from current location">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 2v3"></path>
              <path d="M12 19v3"></path>
              <path d="M2 12h3"></path>
              <path d="M19 12h3"></path>
              <circle cx="12" cy="12" r="8"></circle>
            </svg>
          </button>
          <label class="direction-field">
            <span>To</span>
            <input id="directionsToInput" type="search" autocomplete="off" placeholder="Venue or bus stop">
          </label>
          <button id="directionsSwapButton" class="swap-button" type="button" aria-label="Swap start and destination">⇅</button>
          <button id="directionsSubmitButton" class="small-button directions-submit-button" type="submit">Find Route</button>
        </form>

        <div id="directionsResult" class="directions-result"></div>
        <div id="directionsSuggestions" class="directions-suggestions" hidden></div>
      </section>

      <footer class="app-footer" aria-labelledby="aboutTitle">
        <h2 id="aboutTitle">About</h2>
        <p>
          Bus stop, route, and arrival data are provided by
          <a href="https://nusbus.com/" target="_blank" rel="noopener noreferrer">nusbus.com</a>
          through their API.
        </p>
      </footer>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
